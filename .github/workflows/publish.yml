name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run npm publish --dry-run instead of publishing"
        required: false
        default: "true"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Verify build output
        run: ls -la dist/

      - name: Test
        run: npm test

      - name: Verify tag matches package.json version
        if: github.event_name == 'push'
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match tag ($TAG)"
            exit 1
          fi

      # Turn a masked publish failure into a named cause. npm's OIDC helper
      # swallows every exchange failure at log.verbose/silly and returns
      # undefined (npm 11.19.0, lib/utils/oidc.js), so a broken trusted-publisher
      # binding is invisible at the default loglevel: the publish then goes out
      # with setup-node's placeholder NODE_AUTH_TOKEN and npmjs answers
      # `E404 Not Found - PUT`, which reads like a missing package and is not.
      # This step makes the same two calls npm makes and prints what npmjs
      # actually answered, plus the exact claims the binding is matched against.
      # Diagnostic only: never publishes, never prints either token.
      # Source of truth: references/npm-package-publishing.md (build-loop).
      - name: Diagnose npm trusted-publisher binding
        continue-on-error: true
        env:
          NPM_PACKAGE: '@tyroneross/bookmark'
        run: |
          set -uo pipefail
          ID_TOKEN=$(curl -sS \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org" \
            | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>process.stdout.write((JSON.parse(d).value)||''))")
          if [ -z "${ID_TOKEN}" ]; then
            echo "No GitHub OIDC id-token issued. Check that the job grants permissions.id-token: write."
            exit 0
          fi
          echo "Claims npmjs matches the trusted publisher against:"
          ID_TOKEN="${ID_TOKEN}" node -e '
            const p = JSON.parse(Buffer.from(process.env.ID_TOKEN.split(".")[1], "base64url").toString("utf8"));
            for (const k of ["repository", "repository_owner", "repository_visibility", "workflow_ref", "job_workflow_ref", "ref", "event_name"]) {
              console.log(`  ${k} = ${p[k]}`);
            }
          '
          # npm escapes the scope separator only, and lowercases the escape
          # (npm-package-arg escapedName): @scope%2fname, not %40scope%2Fname.
          ESCAPED="${NPM_PACKAGE/\//%2f}"
          echo "POST /-/npm/v1/oidc/token/exchange/package/${ESCAPED}"
          STATUS=$(curl -sS -o /tmp/npm-oidc-exchange.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${ID_TOKEN}" \
            "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/${ESCAPED}")
          echo "  HTTP ${STATUS}"
          if [ "${STATUS}" = "200" ]; then
            echo "  Exchange succeeded. The trusted-publisher binding is valid. (Token withheld from the log.)"
          else
            echo "  npmjs rejected the exchange. Response body:"
            sed -e 's/^/    /' /tmp/npm-oidc-exchange.json
            echo "  Fix at npmjs.com > @tyroneross/bookmark > Settings > Trusted Publisher."
            echo "  Every field is case-sensitive and unvalidated; match the claims printed above."
          fi

      - name: Publish dry run
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true'
        run: npm publish --dry-run --access public

      - name: Publish to npm with trusted publishing
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run != 'true')
        run: npm publish --access public
